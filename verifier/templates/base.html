<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ByGorgii Verifier{% endblock %}</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070809;--s1:#0c0e12;--s2:#111318;--s3:#161a22;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --blue:#6366f1;--blue2:#818cf8;--blue-g:rgba(99,102,241,.15);--blue-r:rgba(99,102,241,.3);
  --green:#10b981;--green-g:rgba(16,185,129,.12);
  --red:#ef4444;--red-g:rgba(239,68,68,.12);
  --amber:#f59e0b;--amber-g:rgba(245,158,11,.12);
  --t1:#e1e4e8;--t2:#8b949e;--t3:#484f58;
  --r:12px;--r2:8px;
}
html{font-size:15px}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100vh;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.08) 0%,transparent 60%);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue2);text-decoration:none}
a:hover{text-decoration:underline}

.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;
  border-bottom:1px solid var(--border);
  background:var(--s1);
  position:sticky;top:0;z-index:50;
}
.nav-brand{
  display:flex;align-items:center;gap:10px;
  font-size:.9rem;font-weight:700;color:var(--t1);
}
.nav-brand-icon{
  width:32px;height:32px;border-radius:9px;
  background:var(--blue-g);border:1px solid var(--blue-r);
  display:flex;align-items:center;justify-content:center;
}
.nav-brand-icon svg{width:15px;height:15px;color:var(--blue2)}
.nav-links{display:flex;align-items:center;gap:8px}
.nav-link{
  padding:6px 13px;border-radius:6px;
  font-size:.8rem;font-weight:500;color:var(--t2);
  transition:background .12s,color .12s;
}
.nav-link:hover{background:var(--s3);color:var(--t1);text-decoration:none}
.nav-link.active{background:var(--blue-g);color:var(--blue2)}
.nav-user{display:flex;align-items:center;gap:8px}
.nav-user img{width:26px;height:26px;border-radius:50%}
.nav-user span{font-size:.8rem;font-weight:600}

.page{max-width:1100px;margin:0 auto;padding:40px 24px}
.page-center{max-width:480px;margin:0 auto;padding:60px 24px}

.card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.card-body{padding:28px}
.card-head{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.card-title{font-size:.88rem;font-weight:700;flex:1}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:var(--r2);
  font-size:.88rem;font-weight:700;border:none;cursor:pointer;
  transition:opacity .15s,transform .1s;font-family:inherit;
  text-decoration:none;
}
.btn:hover{opacity:.85;transform:translateY(-1px);text-decoration:none}
.btn:active{transform:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--s3);color:var(--t1)}
.btn-discord{
  background:#5865f2;color:#fff;
  display:flex;align-items:center;gap:10px;
  padding:13px 24px;font-size:.95rem;
  width:100%;justify-content:center;
}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-lg{padding:14px 32px;font-size:1rem}

.badge{
  font-size:.68rem;font-weight:700;padding:3px 8px;
  border-radius:20px;letter-spacing:.04em;
}
.badge-green{background:var(--green-g);color:var(--green);border:1px solid rgba(16,185,129,.2)}
.badge-red{background:var(--red-g);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.badge-amber{background:var(--amber-g);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.badge-blue{background:var(--blue-g);color:var(--blue2);border:1px solid var(--blue-r)}

.alert{
  padding:12px 16px;border-radius:var(--r2);
  font-size:.83rem;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:10px;
}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.alert-success{background:var(--green-g);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.alert-error{background:var(--red-g);border:1px solid rgba(239,68,68,.25);color:var(--red)}
.alert-warn{background:var(--amber-g);border:1px solid rgba(245,158,11,.25);color:var(--amber)}

.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{
  text-align:left;padding:9px 14px;
  font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--t2);border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);
}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}

.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.78rem;font-weight:600;color:var(--t2);margin-bottom:6px}
.form-input{
  width:100%;background:rgba(0,0,0,.3);
  border:1px solid var(--border2);border-radius:var(--r2);
  padding:9px 12px;color:var(--t1);font-size:.85rem;
  font-family:inherit;outline:none;
  transition:border-color .15s;
}
.form-input:focus{border-color:var(--blue)}

.text-muted{color:var(--t2)}
.text-faint{color:var(--t3)}
.mt{margin-top:16px}
.mt2{margin-top:24px}
.mb{margin-bottom:16px}
.gap{display:flex;gap:16px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

.stat-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
}
.stat-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:8px}
.stat-val{font-size:2rem;font-weight:800;letter-spacing:-.03em}

.scroll{max-height:400px;overflow-y:auto}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@media(max-width:700px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .nav{padding:12px 16px}
  .page{padding:20px 14px}
  .page-center{padding:30px 16px}
}
</style>
{% block head %}{% endblock %}
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand" style="text-decoration:none">
    <div class="nav-brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    ByGorgii Verifier
  </a>
  <div class="nav-links">
    <a href="/verify" class="nav-link">Verifizieren</a>
    {% if session and session.discord_id in admin_ids %}
      <a href="/admin" class="nav-link active">Admin</a>
    {% endif %}
    {% if session and session.discord_id %}
      <div class="nav-user">
        {% if session.avatar_url %}
          <img src="{{ session.avatar_url }}" alt="">
        {% endif %}
        <span>{{ session.discord_name }}</span>
        <a href="/logout" class="nav-link" style="color:var(--red)">Logout</a>
      </div>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
