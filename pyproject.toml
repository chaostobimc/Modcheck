    "pynacl>=1.5.0",
    "twitchio==2.10.0",
    "flask>=3.0.0,<4.0",
    "flask-sock>=0.7.0",
    "yt-dlp>=2025.6.9",
    "spotdl>=4.4.4",
    "openai>=1.50.0",
    "gTTS>=2.5.0",
    "syncedlyrics>=1.0.1",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "av>=12.0.0",
    "gradio-client>=1.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]
